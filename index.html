        function createSteelPlateWallTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#fcfcfa';
            ctx.fillRect(0, 0, 256, 256);
            ctx.strokeStyle = 'rgba(175, 175, 170, 0.25)';
            ctx.lineWidth = 1;
            for (let x = 0; x <= 256; x += 64) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 256); ctx.stroke();
            }
            for (let y = 0; y <= 256; y += 128) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(256, y); ctx.stroke();
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(2, 2);
            return tex;
        }

                const wallMat = new THREE.MeshStandardMaterial({
                    color: 0xfcfcfa,
                    map: wallTex,
                    roughness: 0.34,
                    metalness: 0.08,
                    transparent: true,
                    opacity: 1.0,
                    side: THREE.DoubleSide
                });
                volumeWallMaterials[vol.id] = wallMat;

                // Perimeter gravel drainage bed & dark recessed shadow plinth
                const gravelBed = new THREE.Mesh(new THREE.BoxGeometry(vol.w + 0.22, 0.05, vol.d + 0.22), gravelMat);
                gravelBed.position.y = 0.04;
                gravelBed.receiveShadow = true;
                volGroup.add(gravelBed);

                const plinth = new THREE.Mesh(new THREE.BoxGeometry(vol.w - 0.04, 0.16, vol.d - 0.04), plinthMat);
                plinth.position.y = 0.08;
                volGroup.add(plinth);

                // 65mm SANAA Ultra-Thin Welded Steel Plate Facades
                const wallT = 0.065;
                const faces = [
                    { code: 'N', w: vol.w, h: vol.h, pos: [0, 0, -vol.d / 2], rotY: 0 },
                    { code: 'S', w: vol.w, h: vol.h, pos: [0, 0, vol.d / 2], rotY: 0 },
                    { code: 'E', w: vol.d, h: vol.h, pos: [vol.w / 2, 0, 0], rotY: Math.PI / 2 },
                    { code: 'W', w: vol.d, h: vol.h, pos: [-vol.w / 2, 0, 0], rotY: Math.PI / 2 }
                ];

                faces.forEach(f => {
                    const wins = (vol.windows || []).filter(w => w.face === f.code);
                    const wallMeshGroup = buildWallWithWindows(f.w, f.h, wallT, wins, vol.floors, wallMat);
                    wallMeshGroup.position.set(f.pos[0], 0, f.pos[2]);
                    wallMeshGroup.rotation.y = f.rotY;
                    volGroup.add(wallMeshGroup);
                });

                // Exterior Rain Downspout
                const spout = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, vol.h, 8), pipeMat);
                spout.position.set(-vol.w / 2 + 0.06, vol.h / 2, -vol.d / 2 - 0.04);
                volGroup.add(spout);

                // Roof Assembly (Hidden in Cutaway Mode)
                const roofGroup = new THREE.Group();
                const roofSlab = new THREE.Mesh(
                    new THREE.BoxGeometry(vol.w - 0.12, 0.08, vol.d - 0.12),
                    new THREE.MeshStandardMaterial({ color: 0xd4d4d0, roughness: 0.85 })
                );
                roofSlab.position.y = vol.h - 0.08;
                roofSlab.castShadow = true;
                roofSlab.receiveShadow = true;
                roofGroup.add(roofSlab);

                const hatch = new THREE.Mesh(
                    new THREE.BoxGeometry(0.68, 0.12, 0.68),
                    new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.4, metalness: 0.4 })
                );
                hatch.position.set(vol.w * 0.2, vol.h - 0.02, -vol.d * 0.18);
                roofGroup.add(hatch);

                if (vol.id === 'E') {
                    const deck = new THREE.Mesh(
                        new THREE.BoxGeometry(vol.w * 0.72, 0.05, vol.d * 0.68),
                        new THREE.MeshStandardMaterial({ color: 0xa16207, roughness: 0.8 })
                    );
                    deck.position.set(0, vol.h + 0.02, 0.1);
                    roofGroup.add(deck);
                }

                volGroup.add(roofGroup);
                volumeRoofGroups[vol.id] = roofGroup;

                // Floor Slabs & Interior Warm PointLights
                const floorHeight = vol.h / vol.floors;
                const baseOffset = vol.sunken ? -vol.sunken : 0.14;
                for (let f = 0; f < vol.floors; f++) {
                    const slabY = f === 0 ? baseOffset : f * floorHeight;
                    const slab = new THREE.Mesh(
                        new THREE.BoxGeometry(vol.w - 0.14, 0.08, vol.d - 0.14),
                        floorWoodMat
                    );
                    slab.position.y = slabY;
                    slab.receiveShadow = true;
                    volGroup.add(slab);

                    const intLight = new THREE.PointLight(0xffedd5, 0.35, 7.5, 1.8);
                    intLight.position.set(0, slabY + floorHeight - 0.35, 0);
                    volGroup.add(intLight);
                    interiorPointLights.push(intLight);
                }

                populateDetailed1To100PlanInterior(volGroup, vol, baseOffset, floorHeight);

                // Selection Outline
                const edgeGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(vol.w + 0.05, vol.h + 0.05, vol.d + 0.05));
                const edgeLine = new THREE.LineSegments(edgeGeo, new THREE.LineBasicMaterial({ color: 0x059669 }));
                edgeLine.position.y = vol.h / 2;
                edgeLine.visible = false;
                volGroup.add(edgeLine);
                volumeEdges[vol.id] = edgeLine;

                // Invisible Raycast Hitbox
                const hitBox = new THREE.Mesh(
                    new THREE.BoxGeometry(vol.w, vol.h, vol.d),
                    new THREE.MeshBasicMaterial({ visible: false })
                );
                hitBox.position.y = vol.h / 2;
                hitBox.userData = { volumeId: vol.id };
                volGroup.add(hitBox);
                volumeMeshes.push(hitBox);

                volumeGroups[vol.id] = volGroup;
                siteGroup.add(volGroup);

                createFloating3DPin(vol.id, vol.shortLabel, vol.x, vol.h + 0.65, vol.z, 'volume');
            });
        }

        function buildWallWithWindows(wallW, wallH, thickness, windows, numFloors, wallMat) {
            const group = new THREE.Group();
            const floorH = wallH / numFloors;
            const glassMat = new THREE.MeshPhysicalMaterial({
                color: 0xe0f2fe,
                transparent: true,
                opacity: 0.26,
                roughness: 0.08,
                metalness: 0.1,
                reflectivity: 0.9
            });
            const frostedMat = new THREE.MeshStandardMaterial({
                color: 0xf1f5f9,
                transparent: true,
                opacity: 0.72,
                roughness: 0.45
            });
            const frameMat = new THREE.MeshStandardMaterial({ color: 0xcbd5e1, metalness: 0.6, roughness: 0.3 });
            const curtainMat = new THREE.MeshStandardMaterial({
                color: 0xfafaf9,
                transparent: true,
                opacity: 0.85,
                side: THREE.DoubleSide,
                roughness: 0.9
            });

            for (let f = 0; f < numFloors; f++) {
                const yBottom = f * floorH;
                const win = windows.find(w => w.floor === f);

                if (!win) {
                    const solid = new THREE.Mesh(new THREE.BoxGeometry(wallW, floorH, thickness), wallMat);
                    solid.position.y = yBottom + floorH / 2;
                    solid.castShadow = true;
                    solid.receiveShadow = true;
                    group.add(solid);
                } else {
                    const wW = Math.min(win.w, wallW - 0.35);
                    const wH = Math.min(win.h, floorH - 0.22);
                    const sillH = Math.max(0.06, win.sill);
                    const headH = Math.max(0.06, floorH - sillH - wH);
                    const winCenterX = THREE.MathUtils.clamp(win.xOff || 0, -(wallW - wW) / 2 + 0.12, (wallW - wW) / 2 - 0.12);

                    const sill = new THREE.Mesh(new THREE.BoxGeometry(wallW, sillH, thickness), wallMat);
                    sill.position.y = yBottom + sillH / 2;
                    sill.castShadow = true;
                    sill.receiveShadow = true;
                    group.add(sill);

                    const header = new THREE.Mesh(new THREE.BoxGeometry(wallW, headH, thickness), wallMat);
                    header.position.y = yBottom + sillH + wH + headH / 2;
                    header.castShadow = true;
                    header.receiveShadow = true;
                    group.add(header);

                    const leftW = (wallW / 2) + (winCenterX - wW / 2);
                    if (leftW > 0.04) {
                        const leftPillar = new THREE.Mesh(new THREE.BoxGeometry(leftW, wH, thickness), wallMat);
                        leftPillar.position.set(-wallW / 2 + leftW / 2, yBottom + sillH + wH / 2, 0);
                        leftPillar.castShadow = true;
                        leftPillar.receiveShadow = true;
                        group.add(leftPillar);
                    }

                    const rightW = (wallW / 2) - (winCenterX + wW / 2);
                    if (rightW > 0.04) {
                        const rightPillar = new THREE.Mesh(new THREE.BoxGeometry(rightW, wH, thickness), wallMat);
                        rightPillar.position.set(wallW / 2 - rightW / 2, yBottom + sillH + wH / 2, 0);
                        rightPillar.castShadow = true;
                        rightPillar.receiveShadow = true;
                        group.add(rightPillar);
                    }

                    const topFrame = new THREE.Mesh(new THREE.BoxGeometry(wW, 0.035, thickness + 0.015), frameMat);
                    topFrame.position.set(winCenterX, yBottom + sillH + wH - 0.018, 0);
                    group.add(topFrame);

                    const botFrame = new THREE.Mesh(new THREE.BoxGeometry(wW, 0.035, thickness + 0.02), frameMat);
                    botFrame.position.set(winCenterX, yBottom + sillH + 0.018, 0);
                    group.add(botFrame);

                    if (win.sliding) {
                        const mullion = new THREE.Mesh(new THREE.BoxGeometry(0.032, wH, thickness + 0.01), frameMat);
                        mullion.position.set(winCenterX, yBottom + sillH + wH / 2, 0);
                        group.add(mullion);
                    }

                    const glass = new THREE.Mesh(
                        new THREE.PlaneGeometry(wW, wH),
                        win.frosted ? frostedMat : glassMat
                    );
                    glass.position.set(winCenterX, yBottom + sillH + wH / 2, 0);
                    group.add(glass);

                    if (win.curtain) {
                        const cPane = new THREE.Mesh(new THREE.PlaneGeometry(wW * 0.38, wH - 0.08, 4, 4), curtainMat);
                        cPane.position.set(winCenterX - wW * 0.28, yBottom + sillH + wH / 2, -0.06);
                        cPane.userData = { baseZ: -0.06, phase: Math.random() * Math.PI * 2 };
                        group.add(cPane);
                        curtainMeshes.push(cPane);
                    }
                }
            }
            return group;
        }

        function createArchitecturalTree(height, crownRadius, leafHex, isSlenderSapling) {
            const tGroup = new THREE.Group();
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x4a3b32, roughness: 0.9 });
            const leafMat = new THREE.MeshStandardMaterial({ color: leafHex, roughness: 0.82 });

            const trunkRadius = isSlenderSapling ? 0.045 : 0.14;
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(trunkRadius * 0.7, trunkRadius, height * 0.65, 8), trunkMat);
            trunk.position.y = (height * 0.65) / 2;
            trunk.castShadow = true;
            tGroup.add(trunk);

            const numClusters = isSlenderSapling ? 5 : 9;
            for (let i = 0; i < numClusters; i++) {
                const r = crownRadius * (0.48 + (i % 3) * 0.12);
                const cluster = new THREE.Mesh(new THREE.DodecahedronGeometry(r, 1), leafMat);
                const angle = (i / numClusters) * Math.PI * 2;
                const dist = isSlenderSapling ? crownRadius * 0.35 : crownRadius * 0.45;
                cluster.position.set(
                    Math.cos(angle) * dist,
                    height * 0.58 + (i % 3) * (crownRadius * 0.42),
                    Math.sin(angle) * dist
                );
                cluster.castShadow = true;
                cluster.receiveShadow = true;
                tGroup.add(cluster);
            }
            return tGroup;
        }

        function createBushyCamelliaShrub() {
            const sGroup = new THREE.Group();
            const stemMat = new THREE.MeshStandardMaterial({ color: 0x4a3b32, roughness: 0.9 });
            const darkLeafMat = new THREE.MeshStandardMaterial({ color: 0x164e27, roughness: 0.75 });
            const budMat = new THREE.MeshStandardMaterial({ color: 0xdc2626, roughness: 0.5 });

            for (let s = 0; s < 4; s++) {
                const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.028, 1.85, 6), stemMat);
                stem.position.set((s - 1.5) * 0.08, 0.92, (s % 2) * 0.08);
                stem.rotation.z = (s - 1.5) * 0.08;
                sGroup.add(stem);
            }
            for (let c = 0; c < 14; c++) {
                const foliage = new THREE.Mesh(new THREE.DodecahedronGeometry(0.28, 1), darkLeafMat);
                const y = 0.45 + (c / 14) * 1.55;
                const ang = c * 1.7;
                const rad = 0.18 + (c % 3) * 0.12;
                foliage.position.set(Math.cos(ang) * rad, y, Math.sin(ang) * rad);
                foliage.castShadow = true;
                sGroup.add(foliage);

                if (c % 3 === 0) {
                    const bud = new THREE.Mesh(new THREE.SphereGeometry(0.035, 6, 6), budMat);
                    bud.position.set(Math.cos(ang) * (rad + 0.16), y + 0.08, Math.sin(ang) * (rad + 0.16));
                    sGroup.add(bud);
                }
            }
            return sGroup;
        }

        function createFloating3DPin(id, label, localX, localY, localZ, type) {
            const container = document.getElementById('markers-container');
            const el = document.createElement('div');
            if (type === 'volume') {
                el.className = 'scene-marker px-2 py-0.5 rounded-full text-[10px] font-bold bg-zinc-900/90 text-white border border-white/30 shadow flex items-center gap-1';
                el.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span><span>${label}</span>`;
            } else {
                el.className = 'scene-marker px-1.5 py-0.5 rounded text-[9px] font-semibold bg-white/85 text-zinc-700 border border-zinc-300 shadow-sm whitespace-nowrap';
                el.innerHTML = `<span>${label}</span>`;
            }
            el.onclick = (e) => {
                e.stopPropagation();
                inspectVolume(id, true);
            };
            container.appendChild(el);

            const worldPos = new THREE.Vector3(localX, localY, localZ).applyAxisAngle(new THREE.Vector3(0, 1, 0), SITE_ROTATION);
            markerElements.push({ id, el, worldPos, type });
        }

        function inspectVolume(id, focusCam) {
            Object.keys(volumeEdges).forEach(k => {
                volumeEdges[k].visible = (k === id);
            });
            VOLUMES_DATA.forEach(v => {
                const pill = document.getElementById(`pill-${v.id}`);
                if (pill) pill.classList.toggle('active', v.id === id);
            });

            const vol = VOLUMES_DATA.find(v => v.id === id);
            const nb = NEIGHBORS_DATA.find(n => n.id === id);
            const card = document.getElementById('inspector-card');
            card.classList.remove('hidden');

            if (vol) {
                document.getElementById('insp-tag').textContent = vol.tag;
                document.getElementById('insp-title').textContent = vol.name;
                document.getElementById('insp-desc').textContent = vol.desc;
                document.getElementById('insp-program').textContent = vol.program;
                document.getElementById('insp-levels').textContent = vol.levelsText;
                document.getElementById('insp-concept').textContent = `"${vol.concept}"`;

                if (focusCam) {
                    const worldTarget = new THREE.Vector3(vol.x, vol.h * 0.45, vol.z).applyAxisAngle(new THREE.Vector3(0, 1, 0), SITE_ROTATION);
                    camState.desiredTarget.copy(worldTarget);
                    camState.desiredRadius = Math.max(9.5, vol.h * 1.9);
                    camState.desiredPhi = 1.02;
                }
            } else if (nb) {
                document.getElementById('insp-tag').textContent = 'Ota Ward Context';
                document.getElementById('insp-title').textContent = nb.name;
                document.getElementById('insp-desc').textContent = nb.desc;
                document.getElementById('insp-program').textContent = 'Adjacent Building';
                document.getElementById('insp-levels').textContent = `${nb.h.toFixed(1)}m Height`;
                document.getElementById('insp-concept').textContent = 'Frames the unfenced Moriyama House parcel.';
            }
        }

        function closeInspector() {
            document.getElementById('inspector-card').classList.add('hidden');
            Object.keys(volumeEdges).forEach(k => volumeEdges[k].visible = false);
            VOLUMES_DATA.forEach(v => {
                const pill = document.getElementById(`pill-${v.id}`);
                if (pill) pill.classList.remove('active');
            });
        }

        function setViewMode(mode) {
            currentViewMode = mode;
            ['exterior', 'courtyard', 'dollhouse', 'xray', 'satellite'].forEach(m => {
                const btn = document.getElementById(`mode-${m}`);
                if (btn) btn.classList.toggle('active', m === mode);
            });

            Object.keys(volumeWallMaterials).forEach(id => {
                const mat = volumeWallMaterials[id];
                if (mode === 'xray') {
                    mat.opacity = 0.24;
                    mat.depthWrite = false;
                } else {
                    mat.opacity = 1.0;
                    mat.depthWrite = true;
                }
            });

            Object.keys(volumeRoofGroups).forEach(id => {
                volumeRoofGroups[id].visible = (mode !== 'dollhouse');
            });
        }

        function triggerCourtyardPhotoView() {
            setViewMode('courtyard');
            selectChapter(2, true);
            inspectVolume('D', false);
        }

        function triggerSatelliteMatchView() {
            setViewMode('satellite');
            selectChapter(1, true);
        }

        function toggleLabels() {
            showLabels = !showLabels;
            const btn = document.getElementById('mode-labels');
            btn.classList.toggle('bg-zinc-900', showLabels);
            btn.classList.toggle('text-white', showLabels);
            markerElements.forEach(m => {
                m.el.style.display = showLabels ? 'flex' : 'none';
            });
        }

        function selectChapter(index, keepMode) {
            const chap = CHAPTERS[index];
            for (let i = 0; i < CHAPTERS.length; i++) {
                const b = document.getElementById(`chap-btn-${i}`);
                if (b) b.classList.toggle('active', i === index);
            }
            const worldTarget = new THREE.Vector3(chap.target.x, chap.target.y, chap.target.z)
                .applyAxisAngle(new THREE.Vector3(0, 1, 0), SITE_ROTATION);
            camState.desiredTarget.copy(worldTarget);
            camState.desiredRadius = chap.spherical.radius;
            camState.desiredPhi = chap.spherical.phi;
            camState.desiredTheta = chap.spherical.theta;

            if (!keepMode && chap.mode) setViewMode(chap.mode);
            if (chap.timePreset !== undefined) updateTimeOfDay(chap.timePreset);
        }

        function updateTimeOfDay(val) {
            currentTimeHours = parseFloat(val);
            const hrs = Math.floor(currentTimeHours);
            const mins = Math.floor((currentTimeHours - hrs) * 60);
            const isNight = (currentTimeHours < 6.0 || currentTimeHours > 18.5);
            const isDuskDawn = (currentTimeHours >= 5.2 && currentTimeHours <= 6.8) || (currentTimeHours >= 17.2 && currentTimeHours <= 19.0);

            let periodLabel = 'Day';
            if (isNight) periodLabel = 'Night';
            else if (isDuskDawn) periodLabel = 'Dusk';

            const timeStr = `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}`;
            const desktopLabel = document.getElementById('time-label');
            if (desktopLabel) desktopLabel.textContent = `${timeStr} • ${periodLabel}`;

            const sDesktop = document.getElementById('time-slider');
            if (sDesktop && parseFloat(sDesktop.value) !== currentTimeHours) sDesktop.value = currentTimeHours;

            const normalizedTime = (currentTimeHours - 6) / 12;
            const sunAngle = normalizedTime * Math.PI;
            const sunY = Math.sin(sunAngle) * 44;
            sunLight.position.set(-Math.cos(sunAngle) * 34, Math.max(2.5, sunY), 24);

            if (isNight) {
                scene.background.setHex(0x0f172a);
                scene.fog.color.setHex(0x0f172a);
                sunLight.intensity = 0.08;
                ambientLight.intensity = 0.25;
                hemiLight.intensity = 0.2;
                interiorPointLights.forEach(l => l.intensity = 1.45);
                streetPointLights.forEach(l => l.intensity = 1.3);
            } else if (isDuskDawn) {
                scene.background.setHex(0xfdba74);
                scene.fog.color.setHex(0xfdba74);
                sunLight.color.setHex(0xfb923c);
                sunLight.intensity = 0.88;
                ambientLight.intensity = 0.42;
                hemiLight.intensity = 0.45;
                interiorPointLights.forEach(l => l.intensity = 1.1);
                streetPointLights.forEach(l => l.intensity = 0.9);
            } else {
                scene.background.setHex(0xcbd5e1);
                scene.fog.color.setHex(0xcbd5e1);
                sunLight.color.setHex(0xfffbeb);
                sunLight.intensity = 1.38;
                ambientLight.intensity = 0.56;
                hemiLight.intensity = 0.64;
                interiorPointLights.forEach(l => l.intensity = 0.35);
                streetPointLights.forEach(l => l.intensity = 0.0);
            }
        }

        // ============================================================================
        // 12. CAMERA CONTROLS & ANIMATION LOOP
        // ============================================================================
        function setupOrbitAndRaycastControls() {
            const dom = renderer.domElement;

            dom.addEventListener('pointerdown', (e) => {
                if (e.button === 0) camState.isDragging = true;
                if (e.button === 2) camState.isPanning = true;
                camState.prevMouse = { x: e.clientX, y: e.clientY };
                camState.pointerDownPos = { x: e.clientX, y: e.clientY };
            });

            window.addEventListener('pointermove', (e) => {
                if (!camState.isDragging && !camState.isPanning) return;
                const dx = e.clientX - camState.prevMouse.x;
                const dy = e.clientY - camState.prevMouse.y;
                camState.prevMouse = { x: e.clientX, y: e.clientY };

                if (camState.isDragging) {
                    camState.desiredTheta -= dx * 0.0065;
                    camState.desiredPhi = THREE.MathUtils.clamp(camState.desiredPhi - dy * 0.0065, 0.03, Math.PI / 2 - 0.03);
                } else if (camState.isPanning) {
                    const panFactor = camState.radius * 0.0014;
                    const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                    const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                    forward.y = 0;
                    forward.normalize();
                    camState.desiredTarget.addScaledVector(right, -dx * panFactor);
                    camState.desiredTarget.addScaledVector(forward, dy * panFactor);
                }
            });

            window.addEventListener('pointerup', (e) => {
                const moveDist = Math.hypot(e.clientX - camState.pointerDownPos.x, e.clientY - camState.pointerDownPos.y);
                if (moveDist < 5 && e.button === 0 && e.target === dom) {
                    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                    raycaster.setFromCamera(mouse, camera);
                    const hits = raycaster.intersectObjects(volumeMeshes);
                    if (hits.length > 0 && hits[0].object.userData.volumeId) {
                        inspectVolume(hits[0].object.userData.volumeId, true);
                    }
                }
                camState.isDragging = false;
                camState.isPanning = false;
            });

            dom.addEventListener('wheel', (e) => {
                e.preventDefault();
                camState.desiredRadius = THREE.MathUtils.clamp(camState.desiredRadius + e.deltaY * 0.022, 3.2, 72);
            }, { passive: false });

            dom.addEventListener('contextmenu', e => e.preventDefault());

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.1);
            const elapsed = clock.getElapsedTime();

            // 1. Smooth Camera Damping
            camState.target.lerp(camState.desiredTarget, 0.08);
            camState.radius += (camState.desiredRadius - camState.radius) * 0.08;
            camState.phi += (camState.desiredPhi - camState.phi) * 0.08;
            camState.theta += (camState.desiredTheta - camState.theta) * 0.08;

            const cx = camState.target.x + camState.radius * Math.sin(camState.phi) * Math.sin(camState.theta);
            const cy = camState.target.y + camState.radius * Math.cos(camState.phi);
            const cz = camState.target.z + camState.radius * Math.sin(camState.phi) * Math.cos(camState.theta);
            camera.position.set(cx, cy, cz);
            camera.lookAt(camState.target);

            // 2. Gentle Linen Curtain Breeze
            curtainMeshes.forEach(c => {
                c.position.z = c.userData.baseZ + Math.sin(elapsed * 1.8 + c.userData.phase) * 0.025;
            });

            // 3. Animate Single Unobstructed Kei Car
            vehicles.forEach(v => {
                v.pos += v.speed * v.dir * dt;
                if (v.pos > 28) v.pos = -28;
                if (v.pos < -28) v.pos = 28;
                v.mesh.position.set(v.laneX, 0, v.pos);
                v.mesh.rotation.y = v.dir > 0 ? 0 : Math.PI;
            });

            // 4. Animate Moving Cyclists on Bicycles
            cyclists.forEach(c => {
                c.pos += c.speed * c.dir * dt;
                if (c.pos > 26) c.pos = -26;
                if (c.pos < -26) c.pos = 26;

                if (c.axis === 'z') {
                    c.mesh.position.set(c.laneX, 0, c.pos);
                    c.mesh.rotation.y = c.dir > 0 ? 0 : Math.PI;
                } else {
                    c.mesh.position.set(c.pos, 0, c.laneZ);
                    c.mesh.rotation.y = c.dir > 0 ? Math.PI / 2 : -Math.PI / 2;
                }

                const pedal = Math.sin(elapsed * 10.5 + c.phase) * 0.38;
                c.leftLeg.rotation.x = pedal;
                c.rightLeg.rotation.x = -pedal;
            });

            // 5. Animate Walking Pedestrians & Residents
            pedestrians.forEach(p => {
                const pts = p.points;
                const pA = pts[p.segIndex];
                const pB = pts[(p.segIndex + 1) % pts.length];
                const segLen = pA.distanceTo(pB);

                p.segProgress += (p.speed * dt) / Math.max(0.1, segLen);
                if (p.segProgress >= 1) {
                    p.segProgress = 0;
                    p.segIndex = (p.segIndex + 1) % pts.length;
                }

                const curA = pts[p.segIndex];
                const curB = pts[(p.segIndex + 1) % pts.length];
                p.mesh.position.lerpVectors(curA, curB, p.segProgress);

                const angle = Math.atan2(curB.x - curA.x, curB.z - curA.z);
                p.mesh.rotation.y = angle;

                const swing = Math.sin(elapsed * 7.5 + p.phase) * 0.35;
                p.leftLeg.rotation.x = swing;
                p.rightLeg.rotation.x = -swing;
                p.leftArm.rotation.x = -swing * 0.7;
                p.rightArm.rotation.x = swing * 0.7;
            });

            // 6. Animate Courtyard Dog & Cat
            gardenPets.forEach(pet => {
                const pts = pet.points;
                const pA = pts[pet.segIndex];
                const pB = pts[(pet.segIndex + 1) % pts.length];
                pet.segProgress += (pet.speed * dt) / Math.max(0.1, pA.distanceTo(pB));
                if (pet.segProgress >= 1) {
                    pet.segProgress = 0;
                    pet.segIndex = (pet.segIndex + 1) % pts.length;
                }
                const curA = pts[pet.segIndex];
                const curB = pts[(pet.segIndex + 1) % pts.length];
                pet.mesh.position.lerpVectors(curA, curB, pet.segProgress);
                pet.mesh.rotation.y = Math.atan2(curB.x - curA.x, curB.z - curA.z);
            });

            // 7. Update Floating 3D Pins
            if (showLabels) {
                const halfW = window.innerWidth * 0.5;
                const halfH = window.innerHeight * 0.5;
                markerElements.forEach(m => {
                    tempProjVec.copy(m.worldPos).project(camera);
                    if (tempProjVec.z > 1) {
                        m.el.style.display = 'none';
                    } else {
                        m.el.style.display = 'flex';
                        const x = (tempProjVec.x * halfW + halfW) | 0;
                        const y = (-tempProjVec.y * halfH + halfH) | 0;
                        m.el.style.left = `${x}px`;
                        m.el.style.top = `${y}px`;
                    }
                });
            }

            renderer.render(scene, camera);
        }
    </script>
